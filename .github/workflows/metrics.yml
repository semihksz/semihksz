name: Metrics

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      # Kartlar ayrı bir dala yazılır (metrics-renders); main ve yılan animasyonunun output dalı etkilenmez.
      - name: Genel bakış kartı
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: semihksz
          template: classic
          filename: metrics-overview.svg
          output_action: commit
          committer_branch: metrics-renders
          committer_message: "chore: update ${filename} - [Skip GitHub Action]"
          config_timezone: Europe/Istanbul
          base: header, activity, community, repositories
          plugin_achievements: yes
          plugin_achievements_threshold: C

      - name: Diller ve alışkanlıklar kartı
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: semihksz
          template: classic
          filename: metrics-languages.svg
          output_action: commit
          committer_branch: metrics-renders
          committer_message: "chore: update ${filename} - [Skip GitHub Action]"
          config_timezone: Europe/Istanbul
          base: ""
          plugin_languages: yes
          plugin_languages_sections: most-used
          plugin_habits: yes
          plugin_habits_charts_type: classic

      - name: Katkı takvimi kartı
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: semihksz
          template: classic
          filename: metrics-calendar.svg
          output_action: commit
          committer_branch: metrics-renders
          committer_message: "chore: update ${filename} - [Skip GitHub Action]"
          config_timezone: Europe/Istanbul
          base: ""
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
